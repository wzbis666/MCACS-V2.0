name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            town-frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versions such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          node scripts/check-release-version.mjs "$version"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix town-frontend

      - name: Verify all layers
        run: |
          npm test
          npm run build
          npm run build:paper
          npm --prefix town-frontend run build
          git diff --check

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release-assets
          jar_path="$(find spigot-plugin/target -maxdepth 1 -name 'minecraft-anticheat-*.jar' ! -name 'original-*' -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" release-assets/MCACS-Paper.jar
          cp compose.release.yml release-assets/compose.yml
          cp penalty-config.yml release-assets/penalty-config.yml
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          (cd release-assets && sha256sum MCACS-Paper.jar compose.yml penalty-config.yml install.sh install.ps1 > SHA256SUMS.txt)

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish-image:
    needs: build-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wzbis666/mcacs
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish-release:
    needs: [build-assets, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --generate-notes --title "MCACS $GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${release_flags[@]}"
