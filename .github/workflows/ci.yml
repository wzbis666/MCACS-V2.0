name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            town-frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix town-frontend

      - name: Run tests
        run: npm test

      - name: Build engine
        run: npm run build

      - name: Build Paper plugin
        run: npm run build:paper

      - name: Build frontend
        run: npm --prefix town-frontend run build

      - name: Check whitespace errors
        run: git diff --check

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mcacs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
